# XcodeGen 定義: `brew install xcodegen && xcodegen generate` で Taiken.xcodeproj を生成
name: Taiken
options:
  bundleIdPrefix: com.example.taiken
  # 画面はすべて日本語。日付や曜日の書式も日本語にする (端末の言語が英語でも)
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # アプリ層は Swift 5 モード + 並行性チェックは警告として全面有効 (中核パッケージは Swift 6 モード)
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: $(TAIKEN_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
packages:
  TaikenCore:
    path: TaikenCore
targets:
  Taiken:
    type: application
    platform: iOS
    sources:
      - Taiken
      # アプリとウィジェットで共有する見た目・App Group・Live Activity の定義
      - Shared
    dependencies:
      - package: TaikenCore
      - target: TaikenWidgets
    entitlements:
      path: Taiken/Taiken.entitlements
      properties:
        # ウィジェットに「今日の状態」だけを渡すための共有領域 (体験帳そのものは置かない)
        com.apple.security.application-groups:
          - $(TAIKEN_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAIKEN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        # 無料の Apple ID などで App Group が使えないときは、Local.xcconfig で空にできる (Shared.xcconfig を参照)
        CODE_SIGN_ENTITLEMENTS: $(TAIKEN_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Taiken/Info.plist
      properties:
        CFBundleDisplayName: 体験
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 今日と明日の予定から、いつもの行動を少し違う視点で体験する提案をつくるために使います。使うのは予定の時間とタイトルだけです。
        NSLocationWhenInUseUsageDescription: 天気など地域の情報が体験づくりに役立つときに、おおよその地域 (市区町村) を知るために使います。座標は送信しません。
        NSLocationDefaultAccuracyReduced: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.taiken.refresh]
        DevelopmentBackendURL: $(DEVELOPMENT_BACKEND_URL)
        TaikenAppGroup: $(TAIKEN_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [taiken]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TaikenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TaikenWidgets
      - Shared
    dependencies:
      - package: TaikenCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: TaikenWidgets/TaikenWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TAIKEN_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAIKEN_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: $(TAIKEN_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES
    info:
      path: TaikenWidgets/Info.plist
      properties:
        CFBundleDisplayName: 体験
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TaikenAppGroup: $(TAIKEN_APP_GROUP)
  TaikenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TaikenTests
    dependencies:
      - target: Taiken
      - package: TaikenCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAIKEN_BUNDLE_ID).tests
  # 体験の流れを実際の画面でたどる UI テスト (各場面のスクリーンショットも残す)
  TaikenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TaikenUITests
    dependencies:
      - target: Taiken
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAIKEN_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Taiken
schemes:
  Taiken:
    build:
      targets:
        Taiken: all
        TaikenTests: [test]
        TaikenUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets: [Taiken]
      targets:
        - TaikenTests
        - TaikenUITests
