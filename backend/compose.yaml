# 個人サーバー (自宅のMac/PC・小さなVPS) で動かすための構成。
# 公開ネットワークへ直接出さず、Tailscale などの私的ネットワーク越しに iOS から接続するのを推奨 (docs/OPERATIONS.md)。
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      # 既定ではこのマシン自身からのみ。Tailscale 等で公開する場合は docs を参照
      - "127.0.0.1:8787:8787"
    volumes:
      - taiken-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  taiken-data:
